- name: Persist state
        if: always()
        run: |
          git config user.name "telegram-bot"
          git config user.email "telegram-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true

          # Dəyişiklik yoxdursa, rebase/push etmədən çıxır
          if git diff --cached --quiet; then
            echo "ℹ️ state.json dəyişməyib, push edilmədi."
            exit 0
          fi

          git commit -m "state yeniləndi [skip ci]"

          success=0
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main 2>/tmp/rebase.log; then
              if git push origin HEAD:main; then
                success=1
                break
              fi
            else
              echo "⚠️ Rebase konflikti — bu run-un state.json versiyası saxlanılır."
              git checkout --theirs state.json 2>/dev/null || true
              git add state.json
              GIT_EDITOR=true git rebase --continue 2>/tmp/rebase2.log || git rebase --abort
              git push origin HEAD:main && { success=1; break; }
            fi
            sleep 5
          done
          if [ "$success" != "1" ]; then
            echo "❌ State push 5 cəhddən sonra da uğursuz oldu."
          fi
