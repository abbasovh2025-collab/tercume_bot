name: Telegram Translator Bot

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-bot]

concurrency:
  group: telegram-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install telethon deep-translator groq

      - name: Run bot
        env:
          TG_SESSION: ${{ secrets.TG_SESSION }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python telegram_translator_bot.py

      - name: Persist state
        if: always()
        run: |
          git config user.name "telegram-bot"
          git config user.email "telegram-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "ℹ️ state.json dəyişməyib, push edilmədi."
            exit 0
          fi

          git commit -m "state yeniləndi [skip ci]"

          success=0
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main 2>/tmp/rebase.log; then
              if git push origin HEAD:main; then
                success=1
                break
              fi
            else
              echo "⚠️ Rebase konflikti — bu run-un state.json versiyası saxlanılır."
              git checkout --theirs state.json 2>/dev/null || true
              git add state.json
              GIT_EDITOR=true git rebase --continue 2>/tmp/rebase2.log || git rebase --abort
              git push origin HEAD:main && { success=1; break; }
            fi
            sleep 5
          done
          if [ "$success" != "1" ]; then
            echo "❌ State push 5 cəhddən sonra da uğursuz oldu."
          fi
